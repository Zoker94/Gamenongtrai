<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#1d2330" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Nông Trại Sủng Vật</title>
</head>
<body>
  <div id="root">
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="top">
      <div id="avatar" title="Tài khoản"></div>
      <div class="pill" id="pname"></div>
      <div class="pill" id="coins"></div>
      <div class="pill" id="place">Nông trại</div>
      <div class="pill" id="weather" data-k="sun">Trời nắng</div>
      <div class="pill" id="net" title="Trạng thái kết nối">…</div>
    </div>
    <div id="toast"></div>
    <div id="hotbar"></div>
    <div id="stick"><div id="knob"></div></div>
    <button id="act" aria-label="Hành động">✋</button>
    <div id="tools">
      <button id="zin" aria-label="Phóng to" title="Phóng to (+)">+</button>
      <button id="zout" aria-label="Thu nhỏ" title="Thu nhỏ (−)">−</button>
      <button id="fs" aria-label="Toàn màn hình" title="Toàn màn hình">⛶</button>
    </div>
    <div id="panel" hidden></div>
  </div>
  <div id="auth" hidden></div>
  <div id="loading"><div class="lbox"><b>Nông Trại</b><div class="bar"><i id="lbar"></i></div><span id="ltext">Đang tải…</span></div></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
